    const compressImage = (file, maxWidth = 1024, quality = 0.75) => {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('File không phải là ảnh hợp lệ'));
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const stringLength = dataUrl.length - 'data:image/jpeg;base64,'.length;
            const sizeInBytes = 4 * Math.ceil(stringLength / 3) * 0.5624896;
            const sizeKb = Math.round((sizeInBytes / 1024) * 10) / 10;
            resolve({ dataUrl, sizeKb });
          };
          img.onerror = (err) => reject(err);
          img.src = e.target.result;
        };
        reader.onerror = (err) => reject(err);
        reader.readAsDataURL(file);
      });
    };

    const PIE_COLORS = ["#ef4444", "#f97316", "#f59e0b", "#2563eb", "#7c3aed", "#db2777", "#059669"];

    const generateConicGradient = (items) => {
      if (!items || items.length === 0) return 'conic-gradient(#e2e8f0 0% 100%)';
      let accumulated = 0;
      const slices = items.map((item, index) => {
        const color = PIE_COLORS[index % PIE_COLORS.length];
        const start = accumulated;
        accumulated += parseFloat(item.percentage) || 0;
        const end = Math.min(accumulated, 100);
        return `${color} ${start}% ${end}%`;
      });
      if (accumulated < 100) {
        slices.push(`#f1f5f9 ${accumulated}% 100%`);
      }
      return `conic-gradient(${slices.join(', ')})`;
    };

      // Export / Import Backup Data
      const handleExportData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(hospitalDatabase, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `SaoLuu_5S_BV_NinhBinh_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              setHospitalDatabase(parsed);
              if (isFirebaseConnected && dbRef) {
                parsed.forEach(item => {
                  dbRef.collection('evaluations_5s').doc(item.id).set(item, { merge: true });
                });
              }
              setToastMessage('✅ Đã nạp dữ liệu sao lưu thành công!');
              setShowSavedToast(true);
              setTimeout(() => setShowSavedToast(false), 3000);
            } else { alert("File dữ liệu không đúng định dạng!"); }
          } catch(err) { alert("Lỗi đọc file: " + err.message); }
        };
        reader.readAsText(file);
      };

      // Form state
      const [department, setDepartment] = useState('');
      const [inspector, setInspector] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [rows, setRows] = useState([
        { id: `row-${Date.now()}-0`, location: 'Xe tiêm cấp cứu 1', criteria: [true, true, true, true, true, true, false], note: '', improvement: 0, image: null }
      ]);
      const [expandedRowId, setExpandedRowId] = useState(null);
      const [deptSearch, setDeptSearch] = useState('');
      const [showSuggestions, setShowSuggestions] = useState(false);
      const suggestionRef = useRef(null);
      const [showSavedToast, setShowSavedToast] = useState(false);
      const [toastMessage, setToastMessage] = useState('Đã lưu thành công dữ liệu!');
      const [dbRef, setDbRef] = useState(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Firebase Setup
      useEffect(() => {
        if (window.firebase && firebaseConfig && firebaseConfig.apiKey) {
          try {
            if (!window.firebase.apps.length) window.firebase.initializeApp(firebaseConfig);
            const db = window.firebase.firestore();
            setDbRef(db);
            setIsFirebaseConnected(true);

            const unsubscribe = db.collection('evaluations_5s').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach(docSnap => list.push({ id: docSnap.id, ...docSnap.data() }));
              if (list.length > 0) setHospitalDatabase(list);
            }, (err) => {
              console.warn("Chưa đọc được dữ liệu Cloud:", err);
            });
            return () => unsubscribe();
          } catch (err) {
            console.error("Firebase init error:", err);
            setIsFirebaseConnected(false);
          }
        } else {
          setIsFirebaseConnected(false);
        }
      }, [firebaseConfig]);

      const selectDepartment = (name) => {
        setDepartment(name);
        setDeptSearch(name);
        setShowSuggestions(false);
      };

      const addRow = () => {
        const newId = `row-${Date.now()}`;
        setRows(prev => [...prev, { id: newId, location: `Vị trí đánh giá ${rows.length + 1}`, criteria: [true, true, true, true, true, true, false], note: '', improvement: 0, image: null }]);
        setExpandedRowId(newId);
      };

      const removeRow = (id, e) => {
        if (e) e.stopPropagation();
        if (rows.length === 1) return alert("Cần giữ ít nhất 1 vị trí kiểm tra!");
        setRows(prev => prev.filter(r => r.id !== id));
        if (expandedRowId === id) setExpandedRowId(null);
      };

      const updateRow = (id, field, value) => {
        setRows(prev => prev.map(r => r.id === id ? { ...r, [field]: value } : r));
      };

      const toggleCriteria = (rowId, critIndex) => {
        setRows(prev => prev.map(r => {
          if (r.id === rowId) {
            const newCriteria = [...r.criteria];
            newCriteria[critIndex] = !newCriteria[critIndex];
            return { ...r, criteria: newCriteria };
          }
          return r;
        }));
      };

      const handleImageChange = async (rowId, e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const { dataUrl, sizeKb } = await compressImage(file, 1024, 0.75);
          updateRow(rowId, 'image', dataUrl);
          updateRow(rowId, 'imageKb', sizeKb);
        } catch (err) { alert("Lỗi nén ảnh: " + err.message); }
      };

      const activeStats = useMemo(() => {
        const total = rows.length;
        const passed = rows.filter(r => r.criteria.slice(0, 6).every(c => c === true) && r.criteria[6] === false).length;
        const percentage = total > 0 ? ((passed / total) * 100).toFixed(1) : 0;
        const totalImprovements = rows.reduce((sum, r) => sum + (parseInt(r.improvement) || 0), 0);
        return { total, passed, percentage, totalImprovements };
      }, [rows]);

      const filteredDepartments = useMemo(() => {
        if (!deptSearch) return DEPARTMENTS;
        return DEPARTMENTS.filter(d => d.toLowerCase().includes(deptSearch.toLowerCase()));
      }, [deptSearch]);

      const handleSaveFirebaseConfig = () => {
        try {
          let configObj = null;
          if (configJsonInput.trim().startsWith('{')) configObj = JSON.parse(configJsonInput);
          else if (configJsonInput.includes('apiKey')) {
            const cleaned = configJsonInput.replace(/const firebaseConfig =/g, '').replace(/;/g, '');
            configObj = Function('"use strict";return (' + cleaned + ')')();
          }
          if (!configObj || !configObj.apiKey) return alert("Vui lòng nhập đúng JSON!");
          localStorage.setItem('FIREBASE_CONFIG_5S', JSON.stringify(configObj));
          setFirebaseConfig(configObj);
          setShowSettings(false);
          setToastMessage('Đã kết nối thành công Firebase Cloud!');
          setShowSavedToast(true);
          setTimeout(() => setShowSavedToast(false), 3000);
        } catch (err) { alert("Lỗi cấu hình: " + err.message); }
      };

      const saveReport = async () => {
        if (!department) return alert("Vui lòng chọn Khoa/Phòng!");
        if (!inspector) return alert("Vui lòng nhập Tên người đánh giá!");

        const detectedSystem = DEPT_SYSTEM_MAP[department] || "LAM_SANG";
        const newEval = {
          id: `eval-${Date.now()}`,
          department,
          system: detectedSystem,
          inspector,
          date,
          rows: JSON.parse(JSON.stringify(rows)),
          createdAt: new Date().toISOString()
        };

        setIsSaving(true);

        // 1. Cập nhật dữ liệu cục bộ tức thì -> Người dùng không bao giờ phải chờ quay tròn!
        setHospitalDatabase(prev => [newEval, ...prev]);
        setToastMessage('✅ Đã lưu kết quả đánh giá thành công!');
        setShowSavedToast(true);
        setTimeout(() => setShowSavedToast(false), 3000);

        // 2. Reset form ngay lập tức cho người dùng tiếp tục công việc
        setDepartment(''); 
        setDeptSearch(''); 
        setInspector('');
        setRows([{ id: `row-${Date.now()}-0`, location: 'Xe tiêm cấp cứu 1', criteria: [true, true, true, true, true, true, false], note: '', improvement: 0, image: null }]);
        setIsSaving(false);

        // 3. Đồng bộ Firebase trên nền (Background Sync) với giới hạn Timeout 3s
        if (isFirebaseConnected && dbRef) {
          try {
            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Firebase Timeout")), 3000));
            await Promise.race([
              dbRef.collection('evaluations_5s').doc(newEval.id).set(newEval),
              timeoutPromise
            ]);
            setToastMessage('⚡ Đã lưu Real-time lên Cloud Firebase!');
          } catch (err) {
            console.warn("Đồng bộ Firebase chậm/offline, dữ liệu đã lưu an toàn vào máy:", err);
          }
        }
      };

      const dashboardStats = useMemo(() => {
        const generateSystemStats = (sysCode) => {
          const evals = filteredHospitalDatabase.filter(e => e.system === sysCode);
          const rankMap = {};
          evals.forEach(ev => {
            if (!rankMap[ev.department]) {
              rankMap[ev.department] = {
                department: ev.department,
                total: 0,
                passed: 0,
                failed: 0,
                percentage: 0,
                inspectors: new Set(),
                dates: new Set(),
                rows: []
              };
            }
            const deptData = rankMap[ev.department];
            if (ev.inspector) deptData.inspectors.add(ev.inspector);
            if (ev.date) deptData.dates.add(ev.date);

            ev.rows.forEach(r => {
              const taggedRow = {
                ...r,
                inspector: r.inspector || ev.inspector || "Đoàn kiểm tra",
                date: r.date || ev.date || "Gần đây"
              };
              deptData.rows.push(taggedRow);
              const ok = r.criteria.slice(0, 6).every(c => c === true) && r.criteria[6] === false;
              if (ok) deptData.passed++; else deptData.failed++;
              deptData.total++;
            });
          });

          // Chuẩn hóa tỷ lệ phần trăm và gộp danh sách người đánh giá
          Object.keys(rankMap).forEach(deptName => {
            const deptData = rankMap[deptName];
            deptData.percentage = deptData.total > 0 ? ((deptData.passed / deptData.total) * 100).toFixed(0) : 0;
            deptData.inspector = Array.from(deptData.inspectors).join(", ") || "Đoàn kiểm tra";
            deptData.date = Array.from(deptData.dates).sort().reverse()[0] || "Gần đây";
          });

          const ranking = Object.values(rankMap).sort((a, b) => b.passed - a.passed || b.percentage - a.percentage);
          const failedUnits = Object.values(rankMap).filter(u => u.failed > 0).sort((a, b) => b.failed - a.failed).slice(0, 5).map(u => ({ label: u.department, value: u.failed }));

          const locationFailureMap = {};
          let totalFailedLocations = 0;
          evals.forEach(ev => {
            ev.rows.forEach(r => {
              const ok = r.criteria.slice(0, 6).every(c => c === true) && r.criteria[6] === false;
              if (!ok) {
                const normalized = r.location.trim();
                locationFailureMap[normalized] = (locationFailureMap[normalized] || 0) + 1;
                totalFailedLocations++;
              }
            });
          });

          const failedLocations = Object.entries(locationFailureMap).map(([loc, count]) => ({
            label: loc, count, percentage: totalFailedLocations > 0 ? ((count / totalFailedLocations) * 100).toFixed(1) : 0
          })).sort((a, b) => b.count - a.count).slice(0, 5);

          const sCounts = { S1: 0, S2: 0, S3: 0, S4: 0, S5: 0 };
          let totalSFailures = 0;
          evals.forEach(ev => {
            ev.rows.forEach(r => {
              if (r.criteria[0] === false) { sCounts.S1++; totalSFailures++; }
              if (r.criteria[1] === false || r.criteria[2] === false || r.criteria[3] === false) { sCounts.S2++; totalSFailures++; }
              if (r.criteria[4] === false) { sCounts.S3++; totalSFailures++; }
              if (r.criteria[5] === false) { sCounts.S4++; totalSFailures++; }
              if (r.criteria[6] === true) { sCounts.S5++; totalSFailures++; }
            });
          });
          const sLabels = { S1: "S1 - Không sàng lọc", S2: "S2 - Không sắp xếp", S3: "S3 - Không sạch sẽ", S4: "S4 - Không duy trì", S5: "S5 - Không sẵn sàng" };
          const sFailures = Object.entries(sCounts).map(([k, count]) => ({
            key: k, label: sLabels[k], count, percentage: totalSFailures > 0 ? ((count / totalSFailures) * 100).toFixed(1) : 0
          }));

          return { ranking, failedUnits, failedLocations, sFailures, totalFailedLocations, totalSFailures };
        };

        return { LAM_SANG: generateSystemStats('LAM_SANG'), PHONG_BAN: generateSystemStats('PHONG_BAN'), CAN_LAM_SANG: generateSystemStats('CAN_LAM_SANG') };
      }, [filteredHospitalDatabase]);

      // Top 3 đv vi phạm của MỖI PHÂN HỆ dành riêng cho TRANG CHỦ
      const homeTop3FailedStats = useMemo(() => {
        const getTop3 = (sysCode) => {
          const evals = filteredHospitalDatabase.filter(e => e.system === sysCode);
          const map = {};
          evals.forEach(ev => {
            let failed = 0;
            ev.rows.forEach(r => {
              const ok = r.criteria.slice(0, 6).every(c => c === true) && r.criteria[6] === false;
              if (!ok) failed++;
            });
            if (failed > 0) map[ev.department] = (map[ev.department] || 0) + failed;
          });
          return Object.entries(map).map(([dept, value]) => ({ label: dept, value })).sort((a, b) => b.value - a.value).slice(0, 3);
        };
        return { LAM_SANG: getTop3('LAM_SANG'), PHONG_BAN: getTop3('PHONG_BAN'), CAN_LAM_SANG: getTop3('CAN_LAM_SANG') };
      }, [filteredHospitalDatabase]);

      const top5FailedUnitsImages = useMemo(() => {
        const currentSystemStats = dashboardStats[activeSubDashboard];
        const top5UnitNames = currentSystemStats.failedUnits.map(u => u.label);
        const result = [];
        filteredHospitalDatabase.forEach(ev => {
          if (ev.system === activeSubDashboard && top5UnitNames.includes(ev.department)) {
            ev.rows.forEach(r => {
              if (r.image) {
                const isPassed = r.criteria.slice(0, 6).every(c => c === true) && r.criteria[6] === false;
                result.push({ department: ev.department, inspector: r.inspector || ev.inspector, date: r.date || ev.date, location: r.location, image: r.image, note: r.note || "Chưa có ghi chú", isPassed });
              }
            });
          }
        });
        return result;
      }, [filteredHospitalDatabase, activeSubDashboard, dashboardStats]);

      const currentStats = dashboardStats[activeSubDashboard];

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 font-sans flex flex-col md:flex-row">
          {showSavedToast && (
            <div className="fixed top-6 right-6 z-50 bg-emerald-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-xs font-bold">
              <span>{toastMessage}</span>
            </div>
          )}

          {/* 🔒 Password Protection Modal for Settings & Admin Login */}
          {showPasswordModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center p-4" onClick={() => setShowPasswordModal(false)}>
              <div className="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl text-slate-900" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-base text-blue-900 flex items-center gap-2">
                    <span>🔑 Yêu cầu Mật khẩu Quản trị</span>
                  </h3>
                  <button onClick={() => setShowPasswordModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-extrabold text-slate-600 uppercase">Nhập mật khẩu để Đăng nhập Admin & Cài đặt:</label>
                  <input
                    type="password"
                    placeholder="Nhập mật khẩu Admin..."
                    className="w-full border-2 border-slate-200 focus:border-blue-600 rounded-xl p-3 text-sm font-bold outline-none"
                    value={passwordInput}
                    onChange={e => setPasswordInput(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') handleVerifyPassword(); }}
                    autoFocus
                  />
                </div>

                <div className="flex justify-end gap-2 border-t pt-3">
                  <button onClick={() => { setShowPasswordModal(false); setPasswordInput(''); }} className="px-4 py-2 text-xs font-bold text-slate-500">Hủy</button>
                  <button onClick={handleVerifyPassword} className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow">Xác nhận</button>
                </div>
              </div>
            </div>
          )}

          {/* ⚙️ Settings & Backup Modal */}
          {showSettings && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center p-4" onClick={() => setShowSettings(false)}>
              <div className="bg-white rounded-3xl p-6 max-w-xl w-full space-y-5 shadow-2xl text-slate-900" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-base text-blue-900 flex items-center gap-2">
                    <span>⚙️ Cài đặt & Sao lưu Dữ liệu</span>
                  </h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                {/* Backup & Restore Buttons */}
                <div className="bg-blue-50/80 p-4 rounded-2xl border border-blue-100 space-y-3">
                  <h4 className="font-extrabold text-xs text-blue-900 uppercase">💾 Sao lưu & Phục hồi dữ liệu máy</h4>
                  <div className="flex flex-wrap gap-2">
                    <button onClick={handleExportData} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow flex items-center gap-1.5">
                      📥 Xuất File Sao Lưu (JSON)
                    </button>
                    <label className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow cursor-pointer flex items-center gap-1.5">
                      📤 Nạp File Dữ Liệu
                      <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                    </label>
                  </div>
                  <p className="text-[11px] text-blue-800 italic">Tự động lưu vĩnh viễn trên máy tính. Xuất file dự phòng nếu muốn chuyển sang máy khác.</p>
                </div>

                {/* Firebase Cloud Config */}
                <div className="space-y-2">
                  <h4 className="font-extrabold text-xs text-slate-800 uppercase flex items-center justify-between">
                    <span>⚡ Cấu hình Đám mây Google Firebase Real-time</span>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] ${isFirebaseConnected ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}`}>
                      {isFirebaseConnected ? '⚡ Đã kết nối Cloud' : '💾 Đang chạy Local'}
                    </span>
                  </h4>
                  <textarea 
                    rows={4} 
                    placeholder='Dán object firebaseConfig (apiKey, authDomain, projectId...)' 
                    className="w-full text-xs p-3 border rounded-xl font-mono focus:border-blue-500 outline-none"
                    value={configJsonInput} onChange={e => setConfigJsonInput(e.target.value)}
                  />
                  <p className="text-[11px] text-slate-500 italic">Giúp đồng bộ dữ liệu vĩnh viễn trên đám mây để sử dụng chung cho nhiều máy tính / điện thoại.</p>
                </div>

                <div className="flex justify-end gap-2 border-t pt-3">
                  <button onClick={() => setShowSettings(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Đóng</button>
                  <button onClick={handleSaveFirebaseConfig} className="px-5 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow">Lưu & Kết nối Cloud</button>
                </div>
              </div>
            </div>
          )}

          {/* FULL IMAGE PREVIEW MODAL */}
          {viewImageModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4" onClick={() => setViewImageModal(null)}>
              <div className="relative bg-white rounded-2xl overflow-hidden max-w-3xl w-full shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="bg-blue-900 text-white p-3 px-4 flex justify-between items-center">
                  <div>
                    <h4 className="font-bold text-sm">{viewImageModal.department}</h4>
                    <p className="text-[11px] text-blue-100">Vị trí: {viewImageModal.location} • Người kiểm tra: {viewImageModal.inspector || 'Đoàn kiểm tra'}</p>
                  </div>
                  <button onClick={() => setViewImageModal(null)} className="text-white/80 hover:text-white">✕</button>
                </div>
                <div className="p-3 bg-black flex items-center justify-center max-h-[75vh]">
                  <img src={viewImageModal.image} alt="Bằng chứng 5S" className="max-h-[70vh] object-contain rounded-lg shadow" />
                </div>
                {viewImageModal.note && (
                  <div className="p-4 bg-slate-50 border-t text-xs text-slate-700">
                    <strong className="text-slate-900">Ghi chú lỗi:</strong> {viewImageModal.note}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 📋 DETAILED UNIT 5S REPORT MODAL */}
          {selectedUnitForReport && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-6" onClick={() => setSelectedUnitForReport(null)}>
              <div className="bg-white rounded-3xl overflow-hidden max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl border" onClick={e => e.stopPropagation()}>

                {/* Modal Header */}
                <div className="bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 text-white p-5 px-6 flex justify-between items-start shrink-0">
                  <div className="space-y-1">
                    <span className="bg-white/20 text-white px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider">Báo cáo đánh giá chi tiết</span>
                    <h3 className="text-lg md:text-xl font-black uppercase">{selectedUnitForReport.department}</h3>
                    <p className="text-xs text-blue-100 italic">
                      👤 Người kiểm tra: <strong>{selectedUnitForReport.inspector || 'Đoàn kiểm tra'}</strong> • 📅 Ngày đánh giá: <strong>{selectedUnitForReport.date || 'Gần đây'}</strong>
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => window.print()}
                      className="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-colors flex items-center gap-1 border border-white/20"
                    >
                      🖨️ In Báo Cáo
                    </button>
                    <button
                      onClick={() => setSelectedUnitForReport(null)}
                      className="bg-white/10 hover:bg-white/20 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Modal Scrollable Body */}
                <div className="p-5 md:p-6 overflow-y-auto space-y-6 flex-1 bg-slate-50/50">

                  {/* Summary Stats Grid */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="bg-white p-3.5 rounded-2xl border border-blue-100 shadow-sm text-center">
                      <span className="text-[10px] font-bold text-slate-500 uppercase">Tổng số vị trí</span>
                      <p className="text-2xl font-black text-slate-800">{selectedUnitForReport.total}</p>

                            >
                              <div className="flex items-center gap-2.5">
                                <span className={`w-6 h-6 rounded-full inline-flex items-center justify-center text-xs font-black ${i === 0 ? 'bg-amber-100 text-amber-800 border border-amber-300' :
                                  i === 1 ? 'bg-slate-200 text-slate-700' :
                                    i === 2 ? 'bg-orange-100 text-orange-800' : 'text-slate-500'
                                  }`}>
                                  {i + 1}
                                </span>
                                <span className="text-slate-800 font-extrabold group-hover:text-blue-700 group-hover:underline transition-colors flex items-center gap-1.5">
                                  {u.department}
                                  <span className="text-[10px] text-blue-600 bg-blue-100 px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 transition-opacity font-normal">🔍 Xem báo cáo</span>
                                </span>
                              </div>
                              <div className="flex items-center gap-2">
                                <span className="text-emerald-700 font-extrabold">{u.passed}/{u.total} Vị trí Đạt</span>
                                <span className="bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded-full font-black">{u.percentage}%</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                    </div>
                  )}
                </main>
              </>
            )}

            {/* MODULE 2: 83 TIÊU CHÍ BYT */}
            {currentModule === 'MODULE_QUALITY_83' && (
              <main className="max-w-5xl mx-auto p-4 md:p-8 space-y-6">
                <div className="bg-gradient-to-br from-blue-900 to-slate-900 rounded-3xl p-8 text-white shadow-2xl">
                  <span className="bg-amber-500/20 text-amber-300 border border-amber-400/40 px-3 py-1 rounded-full text-xs font-extrabold">🚧 Tính năng Đang phát triển</span>
                  <h2 className="text-2xl font-black mt-3">Module 2: 83 Tiêu Chí Chất Lượng Bệnh Viện</h2>
                  <p className="text-xs text-blue-200 mt-2">Theo Quyết định 6858/QĐ-BYT Bộ Y tế</p>
                  <button onClick={() => setCurrentModule('MODULE_5S')} className="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold">Chuyển sang Module 5S</button>
                </div>
              </main>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
